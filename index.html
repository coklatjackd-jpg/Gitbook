            const linkInput = document.getElementById('shareLinkInput');
            const currentUrl = window.location.href;

            let savedPassword = localStorage.getItem('gitbookPassword') || '';
            let passwordMode = 'edit';

            linkInput.value = currentUrl;

            function openPasswordModal(mode) {
                passwordMode = mode;
                passwordField.value = '';
                passwordConfirmField.value = '';
                passwordConfirmField.style.display = (mode === 'create' || mode === 'change') ? 'block' : 'none';

                if (mode === 'edit') {
                    passwordModalTitle.textContent = 'Edit Mode';
                    passwordField.placeholder = 'Enter password';
                    confirmPasswordBtn.textContent = 'Unlock';
                } else if (mode === 'create') {
                    passwordModalTitle.textContent = 'Create Password';
                    passwordField.placeholder = 'Create password';
                    passwordConfirmField.placeholder = 'Confirm password';
                    confirmPasswordBtn.textContent = 'Create';
                } else if (mode === 'change') {
                    passwordModalTitle.textContent = 'Change Password';
                    passwordField.placeholder = 'Current password';
                    passwordConfirmField.placeholder = 'New password';
                    confirmPasswordBtn.textContent = 'Save';
                }

                passwordModal.classList.add('open');
            }

            function closePasswordModal() {
                passwordModal.classList.remove('open');
                passwordField.value = '';
                passwordConfirmField.value = '';
            }

            editModeBtn.addEventListener('click', function () {
                if (!savedPassword) {
                    openPasswordModal('create');
                } else {
                    openPasswordModal('edit');
                }
            });

            createPasswordBtn.addEventListener('click', function () {
                openPasswordModal('create');
            });

            changePasswordBtn.addEventListener('click', function () {
                if (!savedPassword) {
                    openPasswordModal('create');
                } else {
                    openPasswordModal('change');
                }
            });

            cancelPasswordBtn.addEventListener('click', closePasswordModal);

            passwordModal.addEventListener('click', function (event) {
                if (event.target === passwordModal) {
                    closePasswordModal();
                }
            });

            confirmPasswordBtn.addEventListener('click', function () {
                const firstValue = passwordField.value.trim();
                const secondValue = passwordConfirmField.value.trim();

                if (passwordMode === 'edit') {
                    if (!firstValue) {
                        alert('Please enter your password.');
                        return;
                    }

                    if (firstValue === savedPassword) {
                        alert('Edit mode unlocked.');
                        closePasswordModal();
                    } else {
                        alert('Password is incorrect.');
                    }
                    return;
                }

                if (passwordMode === 'create') {
                    if (!firstValue || !secondValue) {
                        alert('Please fill in both password fields.');
                        return;
                    }

                    if (firstValue !== secondValue) {
                        alert('Password does not match.');
                        return;
                    }

                    savedPassword = firstValue;
                    localStorage.setItem('gitbookPassword', savedPassword);
                    alert('Password created successfully.');
                    closePasswordModal();
                    return;
                }

                if (passwordMode === 'change') {
                    if (!firstValue || !secondValue) {
                        alert('Please fill in both password fields.');
                        return;
                    }

                    if (firstValue !== savedPassword) {
                        alert('Current password is incorrect.');
                        return;
                    }

                    savedPassword = secondValue;
                    localStorage.setItem('gitbookPassword', savedPassword);
                    alert('Password changed successfully.');
                    closePasswordModal();
                }
            });

            shareTrigger.addEventListener('click', function (event) {
                event.stopPropagation();
                popover.classList.toggle('open');
                settingsDrawer.classList.remove('open');
                settingsBackdrop.classList.remove('open');
            });

            settingsTrigger.addEventListener('click', function (event) {
                event.stopPropagation();
                popover.classList.remove('open');
                settingsDrawer.classList.toggle('open');
                settingsBackdrop.classList.toggle('open');
            });

            closeSettingsButton.addEventListener('click', function () {
                settingsDrawer.classList.remove('open');
                settingsBackdrop.classList.remove('open');
            });

            settingsBackdrop.addEventListener('click', function () {
                settingsDrawer.classList.remove('open');
                settingsBackdrop.classList.remove('open');
            });

            document.addEventListener('click', function (event) {
                const clickedInsideShare = popover.contains(event.target) || shareTrigger.contains(event.target);
                const clickedInsideSettings = settingsDrawer.contains(event.target) || settingsTrigger.contains(event.target);

                if (!clickedInsideShare) {
                    popover.classList.remove('open');
                }

                if (!clickedInsideSettings) {
                    settingsDrawer.classList.remove('open');
                    settingsBackdrop.classList.remove('open');
                }
            });

            darkModeToggle.addEventListener('change', function () {
                document.body.classList.toggle('dark-mode', darkModeToggle.checked);
            });

            compactModeToggle.addEventListener('change', function () {
                document.body.classList.toggle('compact-mode', compactModeToggle.checked);
            });

            document.querySelectorAll('[data-action]').forEach(function (button) {
                button.addEventListener('click', async function () {
                    const action = button.dataset.action;

                    if (action === 'copy') {
                        try {
                            await navigator.clipboard.writeText(currentUrl);
                            button.textContent = 'Copied';
                            setTimeout(function () {
                                button.textContent = 'Copy';
                            }, 1200);
                        } catch (error) {
                            window.prompt('Copy this link:', currentUrl);
                        }
                        return;
                    }

                    if (action === 'share') {
                        if (navigator.share) {
                            try {
                                await navigator.share({ title: document.title, url: currentUrl });
                                return;
                            } catch (error) {
                                // user cancelled, fallback below
                            }
                        }

                        try {
                            await navigator.clipboard.writeText(currentUrl);
                            button.textContent = 'Ready';
                            setTimeout(function () {
                                button.textContent = 'Share';
                            }, 1200);
                        } catch (error) {
                            window.prompt('Copy this link:', currentUrl);
                        }
                        return;
                    }

                    if (action === 'print') {
                        popover.classList.remove('open');
                        settingsDrawer.classList.remove('open');
                        settingsBackdrop.classList.remove('open');
                        window.print();
                    }
                });
            });
        });
    </script>

    </body>
</html>
